name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, so a Renovate branch can get a rebuilt dist/ pushed back.
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run compile
      - name: dist/ is up to date
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git diff --quiet dist && exit 0
          if [ "$SAME_REPO" != "true" ] || [[ "$BRANCH" != renovate/* ]]; then
            git diff --stat dist
            echo "::error::dist/ is out of date - run 'bun run compile' and commit it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build: rebuild dist"
          git push origin "HEAD:$BRANCH"
          # The bot's push starts a pull_request run that waits for approval; approve it so the
          # required check runs on the new head.
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 24); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request" -q '.workflow_runs[] | "\(.id) \(.conclusion)"')
            pending=$(echo "$runs" | awk '$2 == "action_required" { print $1; exit }')
            if [ -n "$pending" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$pending/approve"
              exit 0
            fi
            [ -n "$runs" ] && exit 0
            sleep 5
          done
          echo "::error::No CI run started for the rebuilt dist/ ($sha)."
          exit 1
