name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, so a Renovate branch can get a rebuilt dist/ pushed back.
          ref: ${{ github.head_ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run compile
      - name: dist/ is up to date
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git diff --quiet dist && exit 0
          if [ "$SAME_REPO" != "true" ] || [[ "$BRANCH" != renovate/* ]]; then
            git diff --stat dist
            echo "::error::dist/ is out of date - run 'bun run compile' and commit it."
            exit 1
          fi
          # Pushes made with GITHUB_TOKEN start no workflows, so re-run CI on the new head explicitly.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build: rebuild dist"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
